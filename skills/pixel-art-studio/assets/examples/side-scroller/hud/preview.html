<html lang="en">

<title>meadow-hud - interface playground</title>
<meta name="description" content="Interactive pixel UI components, states and screens.">
<!-- Pixel font with Chinese glyphs (OFL); the page falls back to a system monospace font offline. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fusion-pixel-12px-proportional-sc@5.3.0/index.css">
<style>
:root{
  --ink:#111a29;--border:#566783;--light:#91a3b8;--surface:#33445c;--inset:#202d40;--text:#f2eddc;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--text);font:18px/1.5 var(--font);background-color:var(--shadow);
  background-image:linear-gradient(var(--inset) 1px,transparent 1px),linear-gradient(90deg,var(--inset) 1px,transparent 1px);background-size:24px 24px}
img{image-rendering:pixelated;display:block;user-select:none;pointer-events:none}
a{color:var(--accent)}
:focus-visible{outline:var(--p) dashed var(--xp);outline-offset:3px}

/* Pixel frame: notched corners from four offset shadows, plus a bevel. */
.frame{background:var(--surface);margin:var(--p);
  box-shadow:0 calc(var(--p)*-1) var(--ink),0 var(--p) var(--ink),calc(var(--p)*-1) 0 var(--ink),var(--p) 0 var(--ink),
    inset 0 var(--p) color-mix(in srgb,var(--light) 35%,transparent),inset 0 calc(var(--p)*-1) color-mix(in srgb,var(--ink) 55%,transparent)}
.sunken{background:var(--inset);

.btn:hover{background:color-mix(in srgb,var(--surface) 85%,#fff)}
.btn:active,.btn[aria-selected=true],.btn[aria-pressed=true]{transform:translateY(var(--p));background:var(--accent);color:var(--ink);
  box-shadow:0 calc(var(--p)*-1) var(--ink),0 var(--p) var(--ink),calc(var(--p)*-1) 0 var(--ink),var(--p) 0 var(--ink),inset 0 var(--p) color-mix(in srgb,var(--ink) 45%,transparent)}

/* The playground fills the viewport: header, then a window whose stage takes the remaining height. */
.app{height:100%;min-height:420px;display:flex;flex-direction:column;gap:14px;padding:18px 24px;max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:24px;margin:0;font-weight:400;display:flex;align-items:center;gap:12px}
header h1::before{content:'';width:12px;height:12px;background:var(--accent);box-shadow:var(--p) var(--p) 0 var(--ink)}
header p{margin:0;color:var(--muted);flex:1 1 360px;font-size:12px}
.lang{display:flex;gap:2px;margin-left:auto}
.window{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;background:var(--inset);padding:9px 14px;border-bottom:var(--p) solid var(--ink)}
.bar i{width:9px;height:9px;background:var(--health)}.bar i:nth-child(2){background:var(--xp)}.bar i:nth-child(3){background:var(--accent)}
.bar span{margin-left:8px;font-size:12px;color:var(--muted);text-transform:uppercase}
.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px}
#tabs{display:flex;flex-wrap:wrap;gap:4px}
#screen{flex:1;min-height:120px;padding:10px;display:flex;justify-content:center;align-items:center;overflow:hidden}
#holder{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:top left;image-rendering:pixelated}
.piece{position:absolute;background:none;border:0;padding:0;outline:0;color:inherit}
.piece:focus-visible{outline:1px solid var(--xp);outline-offset:1px}
.piece img{position:absolute;left:0;top:0}
.piece input{position:absolute;inset:0;margin:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
.viewport{position:absolute;overflow-y:auto;scrollbar-width:none}.viewport::-webkit-scrollbar{display:none}
.tooltip{position:absolute;pointer-events:none;z-index:100}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--shadow) 72%,transparent);z-index:90}
#status{padding:10px 16px;min-height:44px;display:flex;align-items:center;gap:10px}
#status::before{content:'\25B6';color:var(--accent);font-size:11px}
#status::after{content:'';width:9px;height:16px;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.files{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
/* Embedded mode (?embed=1): only the window, edge to edge. */
.embed .app{padding:6px;gap:0;min-height:0;max-width:none}.embed header,.embed .files{display:none}
@media (max-width:600px){.app{padding:12px}.content{padding:10px}.btn{padding:8px 9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  $('name').textContent=L.name||DATA.name;$('tabs').setAttribute('aria-label',T('screens'));
  tabs.forEach((b,i)=>{b.textContent=screenText(DATA.screens[i]).title});
  for(const b of $('lang').children)b.setAttribute('aria-pressed',b.dataset.lang===lang);
  if(current){const t=screenText(current);message(t.description||T('explore',t.title))}
}

// ---- Interactive components ----
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function img(src){const im=new Image();im.src=src;return im}
function place(node,xy,size){node.style.left=xy[0]+'px';node.style.top=xy[1]+'px';if(size){node.style.width=size[0]+'px';node.style.height=size[1]+'px'}}
function message(text){status.textContent=text}
function pop(name){
  const c=DATA.components[name],layer=el('div','overlay');stage.append(layer);
  const node=component({component:name,at:[(current.size[0]-c.size[0])/2,(current.size[1]-c.size[1])/2]},layer);
  node.tabIndex=0;node.setAttribute('role','dialog');node.focus();
  node.onclick=e=>{const rect=node.getBoundingClientRect(),s=rect.width/c.size[0],y=(e.clientY-rect.top)/s;
    if(y>=c.size[1]-26&&y<c.size[1]-8){const x=(e.clientX-rect.left)/s,index=x<c.size[0]/2?0:1;layer.remove();message(T('picked',c.buttons[index]))}};
  layer.onclick=e=>{if(e.target===layer)layer.remove()};
  layer.onkeydown=e=>{if(e.key==='Escape')layer.remove()};
}
function burst(name){
  const c=DATA.components[name],node=component({component:name,at:[current.size[0]/2-c.size[0]/2,70]},stage);
  floating.find(f=>f.el===node).once=true;message(c.text);
}
function component(p,parent){
  const c=DATA.components[p.component],node=el('div','piece');
  place(node,p.at,c.size);parent.append(node);
  const picture=img(c.states[p.state||c.default]);node.append(picture);
  const set=s=>{picture.src=c.states[s]};node.setAttribute('aria-label',p.label||c.label||p.component);
  if(c.type==='canvas'||c.type==='hud'){for(const child of c.children||[])component(child,node)}
  if(c.type.endsWith('-bar')||c.type==='bar'){
    picture.src=c.layers.track;
    const fill=el('div'),r=c.fill_rect;place(fill,r.slice(0,2),[r[2],r[3]]);
    fill.style.position='absolute';fill.style.overflow='hidden';fill.append(img(c.layers.fill));node.append(fill);
    const update=v=>{fill.style.width=Math.round(r[2]*v)+'px'};update(c.value);bindings[p.component]=update;
  }
  if(c.type==='slider'){
    picture.src=c.layers.track;const thumb=img(c.layers.thumb),input=document.createElement('input');
    input.type='range';input.min=0;input.max=100;input.value=Math.round(c.value*100);input.disabled=p.state==='disabled';
    if(input.disabled)node.style.opacity='.5';
    input.setAttribute('aria-label',p.label||p.component);node.append(thumb,input);
    const update=()=>{thumb.style.left=Math.round((c.size[0]-c.thumb_size[0])*input.value/100)+'px';
      if(p.bind&&bindings[p.bind])bindings[p.bind](input.value/100);
      message(T('slider',p.label||p.component,input.value))};
    thumb.style.left=Math.round((c.size[0]-8)*c.value)+'px';input.oninput=update;
  }
  if((c.type==='toggle'||c.type==='switch')&&p.state!=='disabled'){
    let value=c.value;node.tabIndex=0;node.setAttribute('role','switch');node.setAttribute('aria-checked',value);node.style.cursor='pointer';
    const toggle=()=>{value=!value;set(value?'on':'off');node.setAttribute('aria-checked',value);message(T('toggled',p.label||p.component,T(value?'on':'off')))};
    node.onclick=toggle;node.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}};
  }
  if(c.type==='button'){
    const disabled=p.state==='disabled';node.tabIndex=disabled?-1:0;node.setAttribute('role','button');node.style.cursor=disabled?'default':'pointer';
    if(!disabled){
      node.onpointerenter=()=>set('hover');node.onpointerleave=()=>set('normal');
      node.onpointerdown=()=>set('pressed');node.onpointerup=()=>set('hover');
      const act=()=>{if(p.action){const [action,id]=p.action.split(':');if(action==='open')pop(id);if(action==='float')burst(id)}else message(T('picked',c.label))};
      node.onclick=act;node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}};
    }
  }
  if(c.type==='dropdown'&&p.state!=='disabled'){
    let opened=false,selected=c.selected;node.tabIndex=0;node.setAttribute('role','combobox');node.setAttribute('aria-expanded',false);node.style.cursor='pointer';
    const close=()=>{opened=false;set('selected-'+selected);node.style.zIndex=0;node.style.height=c.size[1]+'px';node.setAttribute('aria-expanded',false)};
    node.onclick=e=>{
      if(!opened){if(openMenu)openMenu();opened=true;set('open-'+selected);node.style.zIndex=50;node.style.height=(c.size[1]+c.options.length*14+4)+'px';node.setAttribute('aria-expanded',true);openMenu=close}
      else{const rect=node.getBoundingClientRect(),y=(e.clientY-rect.top)/(rect.width/c.size[0]);if(y>=c.size[1])selected=Math.min(c.options.length-1,Math.max(0,Math.floor((y-c.size[1]-2)/14)));close();message(T('selected',c.options[selected]))}
    };
    node.onkeydown=e=>{if(e.key==='Escape'){close()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+c.options.length)%c.options.length;close();message(T('selected',c.options[selected]))}};
  }
  if(c.type==='scroll-view'){
    picture.src=c.layers.skin;
    const v=el('div','viewport');place(v,c.viewport.slice(0,2),c.viewport.slice(2));v.append(img(c.layers.content));
    v.firstChild.style.position='relative';v.tabIndex=0;v.setAttribute('aria-label',T('inventory'));node.append(v);
    const thumb=el('div');thumb.style.position='absolute';thumb.style.background=DATA.theme.light;
    const hh=Math.max(6,Math.round((c.size[1]-8)*c.viewport[3]/c.content_size[1]));place(thumb,[c.size[0]-8,4],[4,hh]);node.append(thumb);
    v.onscroll=()=>{thumb.style.top=4+Math.round((c.size[1]-8-hh)*v.scrollTop/Math.max(1,c.content_size[1]-c.viewport[3]))+'px';message(T('scroll','',v.scrollTop))};
  }
  if((c.type.endsWith('-bar')||c.type==='bar')&&c.layers.text){const tx=img(c.layers.text);tx.style.zIndex=2;node.append(tx)}
  if(c.type==='hotbar'||c.type==='list'){
    const rects=c.slot_rects||c.row_rects,names=(c.items||c.rows||[]);node.style.cursor='pointer';node.tabIndex=0;node.setAttribute('role','listbox');
    let sel=c.selected||0;
    const pick=i=>{sel=i;set('selected-'+i);const it=names[i]||{};message(T('selected',it.label||((c.type==='hotbar'?'#':'')+(i+1))))};
    node.onclick=e=>{const r=node.getBoundingClientRect(),s=r.width/c.size[0],x=(e.clientX-r.left)/s,y=(e.clientY-r.top)/s;
      rects.forEach((q,i)=>{if(x>=q[0]-2&&x<q[0]+q[2]+2&&y>=q[1]-2&&y<q[1]+q[3]+2)pick(i)})};
    node.onkeydown=e=>{const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(k){e.preventDefault();pick((sel+k+rects.length)%rects.length)}
      if(c.type==='hotbar'&&/^[1-9]$/.test(e.key)&&+e.key<=rects.length)pick(+e.key-1)};
  }
  if(c.type==='dialogue'){
    let timer,typing=true,blink=false;node.style.cursor='pointer';node.tabIndex=0;
    const finish=()=>{clearInterval(timer);typing=false;set(c.choices.length?'choice-0':'normal');
      if(!c.choices.length)timer=setInterval(()=>{blink=!blink;set(blink?'waiting':'normal')},450)};
    const play=()=>{clearInterval(timer);typing=true;let i=0;set('typing-0');
      timer=setInterval(()=>{i++;if(i>=c.typing_frames){finish();return}set('typing-'+i)},c.duration_ms)};
    node.onclick=e=>{if(typing){finish();return}
      if(c.choices.length){const r=node.getBoundingClientRect(),s=r.width/c.size[0],y=(e.clientY-r.top)/s;
        c.choice_rects.forEach((q,i)=>{if(y>=q[1]&&y<q[1]+q[3]){set('choice-'+i);message(T('picked',c.choices[i]))}})}
      else play()};
    node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();node.onclick({clientY:-1e9})}};
    play();
  }
  if(c.type==='floating-text')floating.push({el:node,picture,frames:Object.values(c.states),duration:c.duration_ms,start:performance.now(),once:false});
  if(p.tooltip){
    let tip;
    node.addEventListener('pointerenter',()=>{const tc=DATA.components[p.tooltip];tip=img(tc.states[tc.default]);tip.className='tooltip';
      const stageRect=stage.getBoundingClientRect(),rect=node.getBoundingClientRect(),s=stageRect.width/current.size[0];
      // Above the target (the pointer points down); below it only when there is no room above.
      const top=(rect.top-stageRect.top)/s,bottom=(rect.bottom-stageRect.top)/s,th=tc.size[1];
      const y=top-th-2>=0?top-th-2:Math.min(current.size[1]-th,bottom+4);
      place(tip,[Math.max(0,Math.min(current.size[0]-tc.size[0],(rect.left-stageRect.left)/s)),Math.max(0,y)]);stage.append(tip)});
    node.addEventListener('pointerleave',()=>{if(tip)tip.remove()});
  }
  return node;
}
// Fit the screen into the space left in the window: integer zoom when it fits, a fractional fit otherwise.
function fit(){
  if(!current)return;const box=$('screen'),w=current.size[0],h=current.size[1];
  $('holder').style.width=$('holder').style.height='0px';
  const s0=Math.min((box.clientWidth-20)/w,(box.clientHeight-20)/h),s=s0>=1?Math.min(8,Math.floor(s0)):Math.max(.25,s0);
  stage.style.transform='scale('+s+')';$('holder').style.width=w*s+'px';$('holder').style.height=h*s+'px';
}
function show(screen){
  current=screen;stage.replaceChildren();bindings={};floating=[];openMenu=null;
  stage.style.width=screen.size[0]+'px';stage.style.height=screen.size[1]+'px';stage.style.background=screen.background||DATA.theme.ink;
  for(const child of screen.children)component(child,stage);
  fit();
  for(const b of tabs){const on=b.dataset.id===screen.id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}
  const t=screenText(screen);message(t.description||T('explore',t.title));
}
const tabs=[];
DATA.screens.forEach((screen,i)=>{const b=el('button','btn',screen.title||screen.id);b.type='button';b.dataset.id=screen.id;b.setAttribute('role','tab');
  b.onclick=()=>show(screen);
  b.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(DATA.screens[n]);tabs[n].focus()}};
  tabs.push(b);$('tabs').append(b)});
if(LANGS.length>1&&!params.get('embed')){$('lang').hidden=false;
  for(const lang of LANGS){const b=el('button','btn',lang==='en'?'EN':(LOCALES[lang].label||lang));b.type='button';b.dataset.lang=lang;b.onclick=()=>setLang(lang);$('lang').append(b)}}
function tick(now){floating=floating.filter(f=>f.el.isConnected);for(const f of floating){const n=Math.floor((now-f.start)/f.duration);if(f.once&&n>=f.frames.length){f.el.remove();continue}const index=n%f.frames.length;if(index!==f.last){f.picture.src=f.frames[index];f.last=index}}requestAnimationFrame(tick)}
$('caption').textContent=DATA.name+' / preview.html';
setLang(pickLang());
if(DATA.screens.length)show(DATA.screens[0]);requestAnimationFrame(tick);
addEventListener('resize',fit);
// Follow language changes from an embedding page.
addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.lang&&LANGS.includes(e.data.lang))setLang(e.data.lang)});
</script>
